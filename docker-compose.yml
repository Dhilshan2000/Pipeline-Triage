services:
  # ---------------------------------------------------------------------------
  # Data Stores & Infrastructure
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: pipeline_triage_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example_password
      MONGO_INITDB_DATABASE: pipeline_triage
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: pipeline_triage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: pipeline_triage_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mailpit:
    image: axllent/mailpit:latest
    container_name: pipeline_triage_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

  # ---------------------------------------------------------------------------
  # Backend API & Asynchronous Worker
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipeline_triage_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://root:example_password@mongo:27017/pipeline_triage?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      - mongo
      - redis
      - qdrant
      - mailpit
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pipeline_triage_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://root:example_password@mongo:27017/pipeline_triage?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      - backend
      - mongo
      - redis
      - qdrant
      - mailpit
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Mock Kanvaro MCP Server
  # ---------------------------------------------------------------------------
  mock-kanvaro:
    build:
      context: ./mock_kanvaro
      dockerfile: Dockerfile
    container_name: pipeline_triage_mock_kanvaro
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BOT_USER=triage-bot
      - BOT_PASSWORD=mock_kanvaro_secure_pass

  # ---------------------------------------------------------------------------
  # Next.js Web App
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipeline_triage_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
